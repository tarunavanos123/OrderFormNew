<template>
    <div class="slds-p-around_medium    summary-container">
        <!-- Contact Details Section -->
        <section class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
                <div class="label-value">
                    <p class="label"><strong>Company</strong></p>
                    <p class="">{customer.CompanyName}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
                <div class="label-value">
                    <p class="label"><strong>PO #</strong></p>
                    <p class="">{customer.PO}</p>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
                <div class="label-value">
                    <p class="label"><strong>Name</strong></p>
                    <p class="">{customer.FirstName} {customer.LastName}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
                <div class="label-value">
                    <p class="label"><strong>Email</strong></p>
                    <p class="">{customer.Email}</p>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-2">
                <div class="label-value">
                    <p class="label"><strong>Phone</strong></p>
                    <p class="">{customer.Phone}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2">
                <div class="label-value">
                    <p class="label"><strong>Fax</strong></p>
                    <p class="">{customer.Fax}</p>
                </div>
            </div>
        </section>

        <!-- Address Section -->
        <section class="slds-grid slds-gutters slds-m-top_medium">
            <div class="slds-col slds-size_1-of-2">
                <p><b>Billing Address:</b></p>
                <template if:true={customer.BillingAddress.billingStreet}>
                    <p>{customer.BillingAddress.billingStreet}</p>
                </template>
                <p>
                    <template if:true={customer.BillingAddress.billingCity}>
                        {customer.BillingAddress.billingCity},
                    </template>
                    <template if:true={customer.BillingAddress.billingState}>
                        {customer.BillingAddress.billingState},&nbsp;
                    </template>
                    <template if:true={customer.BillingAddress.billingZipCode}>
                        {customer.BillingAddress.billingZipCode}
                    </template>
                </p>
            </div>
            <div class="slds-col slds-size_1-of-2">
                <p><b>Shipping Address:</b></p>
                <template if:true={customer.ShippingAddress.shippingStreet}>
                    <p>{customer.ShippingAddress.shippingStreet}</p>
                </template>
                <p>
                    <template if:true={customer.ShippingAddress.shippingCity}>
                        {customer.ShippingAddress.shippingCity},
                    </template>
                    <template if:true={customer.ShippingAddress.shippingState}>
                        {customer.ShippingAddress.shippingState},&nbsp;
                    </template>
                    <template if:true={customer.ShippingAddress.shippingZipCode}>
                        {customer.ShippingAddress.shippingZipCode}
                    </template>
                </p>
            </div>
        </section>

        <!-- Product Table -->

        <div class="slds-grid slds-wrap slds-m-top_large">
            <table class="slds-table slds-table_cell-buffer custom-table">
                <thead>
                    <tr>
                        <th scope="col">
                            <div class="slds-truncate" title="Item #">Item #</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_left" title="Description">Product Name</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_right" title="Quantity">Quantity</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_right" title="Unit Price">Unit Price</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_right" title="Price">Price</div>
                        </th>
                    </tr>
                    <tr>
                        <td colspan="5">
                            <hr class="header-divider" />
                        </td>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={productData} for:item="product">
                        <tr key={product.index} class="slds-no-row-borders custom-row">
                            <td>
                                <div class="slds-truncate" title={product.index}>{product.index}</div>
                            </td>
                            <td>
                                <div class="slds-truncate slds-text-align_left" title={product.description}>{product.productName}</div>
                                <!-- <p>Product Option:</p>
                                    <ul>
                                        <li>Coffee</li>
                                        <li>Tea</li>
                                        <li>Milk</li>
                                    </ul> -->

                            </td>
                            <td>
                                <div class="slds-truncate slds-text-align_right" title={product.quantity}>{product.quantity}</div>
                            </td>
                            <td>
                                <div class="slds-truncate slds-text-align_right" title={product.unitPrice}>${product.actualPrice}</div>
                            </td>
                            <td>
                                <div class="slds-truncate slds-text-align_right" title={product.price}>${product.subtotal}</div>
                            </td>
                            <!-- <p key={product.index}>hello</p> -->
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- <template if:true={isProductOptionsUpdatedList}> -->
           
            <div class="slds-grid slds-wrap slds-m-top_large">
                <div><b>OFFER PRODUCTS:</b></div>
                <table class="slds-table slds-table_cell-buffer custom-table">
                    <thead>
                        <tr>
                        
                            <th scope="col">
                                <div class="slds-truncate slds-text-align_left slds-p-vertical_small" title="Parent Product ID">Parent Product Name</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate slds-text-align_left slds-p-vertical_small" title="Product Name">Product Name</div>
                            </th>
                        </tr>
                        <tr>
                            <td colspan="5">
                                <hr class="header-divider" />
                            </td>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- <template for:each={productOptionsUpdatedList} for:item="product">
                            <tr key={product.id} class="slds-no-row-borders custom-row">
                                <td>
                                    <div class="slds-truncate slds-text-align_left" title={product.master_product_name}>{product.master_product_name}
                                        <template lwc:if={product.parentProduct}>
                                            - ({product.parentProduct})
                                        </template>

                                    </div>
                                </td>
                                <td>
                                    <div class="slds-truncate slds-text-align_left" title={product.product_name}>{product.product_name}</div>

                                </td>
                            </tr>
                        </template> -->

                        <template for:each={productData} for:item="product">
                            
                            <template for:each={product.productOptionsList} for:item="product">
                                <tr key={product.id} class="slds-n.o-row-borders custom-row">
                                    <td>
                                        <div class="slds-truncate slds-text-align_left" title={product.master_product_name}>{product.master_product_name}
                                            <template lwc:if={product.parentProduct}>
                                                - ({product.parentProduct})
                                            </template>

                                        </div>
                                    </td>
                                    <td>
                                        <div class="slds-truncate slds-text-align_left" title={product.product_name}>{product.product_name}</div>

                                    </td>
                                </tr>
                            </template>
                            <template for:each={product.secondLevelProductOptionsList} for:item="product">
                                <tr key={product.id} class="slds-n.o-row-borders custom-row">
                                    <td>
                                        <div class="slds-truncate slds-text-align_left" title={product.master_product_name}>{product.master_product_name}
                                            <template lwc:if={product.parentProduct}>
                                                - ({product.parentProduct})
                                            </template>

                                        </div>
                                    </td>
                                    <td>
                                        <div class="slds-truncate slds-text-align_left" title={product.product_name}>{product.product_name}</div>

                                    </td>
                                </tr>
                            </template>
                        </template>



                    </tbody>
                </table>
            </div>

        <!-- </template> -->

        <div class="slds-grid slds-grid_vertical-align-end slds-grid--align-spread slds-gutters">


            <div class="slds-col slds-size_1-of-3">
                <section>
                    <template if:true={document}>
                        <p class="label"><strong>Attached Documents</strong></p>
                        <div class="slds-p-bottom_x-small slds-p-left-samall">
                            <template if:true={document.prescriptionFiles}>
                                <p class="label slds-p-top_x-small"><strong>Prescription Files</strong></p>
                                <template for:each={document.prescriptionFiles} for:item="Prescription">
                                    <li key={Prescription.id}>
                                        {Prescription.Title}
                                    </li>
                                </template>
                            </template>
                            <template if:true={document.discountFiles}>
                                <p class="label slds-p-top_x-small"><strong>Discount Document</strong></p>
                                <template for:each={document.discountFiles} for:item="Discount">
                                    <li key={Discount.id}>
                                        {Discount.Title}
                                    </li>
                                </template>
                            </template>
                            <template if:true={document.taxExemptFiles}>
                                <p class="label slds-p-top_x-small"><strong>Tax Exemption Certificate</strong></p>
                                <template for:each={document.taxExemptFiles} for:item="taxExemption">
                                    <li key={taxExemption.id}>
                                        {taxExemption.Title}
                                    </li>
                                </template>
                            </template>
                        </div>
                    </template>
                </section>
                <!-- Comments and Submit Section -->
                <section class="slds-m-botttom_xx-large">
                    <p class="label"><strong>Comments/Notes</strong></p>
                    <div>
                        <textarea rows="3" class="slds-textarea"></textarea>
                    </div>
                </section>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <!-- Price Summary Section -->
                <div class="slds-grid slds-grid_align-end">
                    <div class="slds-grid slds-wrap slds-grid_align-end slds-m-top_medium slds-size_3-of-4">
                        <div class="slds-grid slds-grid_align-spread slds-size_1-of-1 slds-p-vertical_small">
                            <span><strong>Subtotal</strong></span>
                            <span>${productinfo.subtotal}</span>
                        </div>
                        <div class="slds-grid slds-grid_align-spread slds-size_1-of-1 slds-p-vertical_small">
                            <span><strong>Shipping Price</strong></span>
                            <span>${productinfo.selectedShippingPrice}</span>
                        </div>
                        <div class="slds-grid slds-grid_align-spread slds-size_1-of-1 slds-p-vertical_small">
                            <span><strong>Tax</strong></span>
                            <span>${productinfo.estimatedTax}</span>
                        </div>
                        <div class="slds-grid slds-grid_align-spread slds-size_1-of-1 slds-p-vertical_small">
                            <span><strong>Discounted Amount</strong></span>
                            <span>${productinfo.discountAmount}</span>
                        </div>
                        <div class="slds-grid slds-grid_align-spread slds-size_1-of-1 slds-p-vertical_small">
                            <span><strong>Handling Price</strong></span>
                            <span>${productinfo.handlingFee}</span>
                        </div>
                        <div
                            class="slds-grid slds-grid_align-spread slds-size_1-of-1 slds-p-top_medium slds-p-bottom_large slds-text-title_bold">
                            <span><strong>Total Price</strong></span>
                            <span>${productinfo.totalPrice}</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</template>
